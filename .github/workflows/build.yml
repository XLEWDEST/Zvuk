name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-22.04
            args: --bundles deb,appimage
          - os: windows-latest
            args: --bundles msi
          - os: macos-latest
            args: --bundles app,dmg
    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            libfuse2

      - name: Install frontend dependencies
        run: npm install

      - name: Build bundle
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.platform.args }}

      - name: Set version and rename installers
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -nE 's/^version = "([^"]+)"/\1/p' src-tauri/Cargo.toml)
          mkdir -p artifacts
          cd src-tauri/target/release/bundle
          find . -type f \( -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) | while read -r f; do
            ext="${f##*.}"
            cp "$f" "../../../../artifacts/Zvuk_${VERSION}.${ext}"
          done

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform.os }}
          path: artifacts
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        shell: bash
        run: |
          VERSION=$(sed -nE 's/^version = "([^"]+)"/\1/p' src-tauri/Cargo.toml)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: download
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}
          name: "Звук v${{ env.VERSION }}"
          files: download/Zvuk_*
